name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  player:
    name: Player (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @visset/player exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: player-bundle
          path: python/src/visset/_assets/player.js
          if-no-files-found: error

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    needs: player
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: player-bundle
          path: python/src/visset/_assets
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Build wheel and smoke-test the installed CLI
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv build
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/visset run ../examples/bsearch.py -o /tmp/bsearch.html
          grep -q "visset-player" /tmp/bsearch.html
